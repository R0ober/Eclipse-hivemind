schema_version: 1

# All-honest reference run. Used to check that epochs are real aggregation rounds
# (one epoch per n_peers x 2 steps) and that averaging mostly succeeds.

experiment:
  name: all-honest
  seed: 7
  rounds: 10

aggregator:
  endpoint: http://aggregator:8080

bootstrap:
  seeds:
    node_type: normal
    count: 1
  policy: seed_only

node_types:
  normal:
    count: 3
    image: eclipse-hivemind-node-honest:dev
    parameters:
      batch_size: 32
      learning_rate: 0.05
      target_batch_size: 192      # 3 peers x 32 x 2
      matchmaking_time: 10
      averaging_timeout: 30
      step_delay_seconds: 1.0    # paces the toy loop so a round is a real swarm round
      eval_size: 4096
