[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eclipse-hivemind"
version = "0.1.0"
description = "Eclipse attack experiments using Hivemind"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hivemind>=1.1.0",
    "torch>=2.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "docker>=7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.scripts]
eclipse-hivemind = "eclipse_hivemind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
