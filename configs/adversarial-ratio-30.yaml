schema_version: 1

experiment:
  name: adversarial-ratio-30      
  seed: 42                       
  rounds: 50                      

aggregator:
  endpoint: http://aggregator:8080   

startup:
  phases:
    - name: honest-network
      node_types: [normal]
      wait_after_seconds: 0
    - name: adversarial-nodes
      node_types: [adversarial]

bootstrap:
  seeds:
    node_type: normal             
    count: 1
  policy: seed_only               
                                  

node_types:
  normal:
    count: 3
    image: eclipse-hivemind-node-honest:dev
    parameters:
      batch_size: 32
      learning_rate: 0.05
      target_batch_size: 256
      matchmaking_time: 5
  adversarial:
    count: 3
    image: eclipse-hivemind-node-honest:dev
    parameters:
      strategy: eclipse
      target_prefix: "expert."    # attack target; node derives its DHTID source from this
